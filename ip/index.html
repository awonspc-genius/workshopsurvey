<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IP 관리 | BRK Genius</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--pink:#6B3FA0;--pink-soft:#F1ECFA;--ink:#191b22;--mid:#6b7180;--line:#e3e6ec;--bg:#eef0f4;--card:#fff;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 10px 30px rgba(20,24,40,.07)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}

#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:90;padding:24px}
#gate .box{background:var(--card);border-radius:20px;padding:32px 28px;width:min(360px,100%);box-shadow:var(--shadow);text-align:center}
#gate h1{font-size:19px;margin:0 0 6px}
#gate p{color:var(--mid);font-size:13px;margin:0 0 20px}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-align:center;letter-spacing:.3em;font-size:17px}
#gate button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:var(--pink);color:#fff;font-weight:600}
#gate .err{color:var(--pink);font-size:13px;height:18px;margin-top:8px}

.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top .in{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.brand .dot{width:26px;height:26px;border-radius:9px;background:var(--pink)}
.brand b{font-size:16px;font-weight:700}
.back{color:var(--mid);font-size:13px;text-decoration:none}
.views{display:flex;background:#f4f6f9;border-radius:11px;padding:4px;gap:2px}
.views button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--mid)}
.views button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 110px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .grow{flex:1;min-width:150px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 13px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:#c9cfd9}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.btn.warn{color:var(--pink);border-color:#f6c9dd}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:9px}
input.s,select.s{padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
input.s{width:100%}

.panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.panel+.panel{margin-top:14px}
.empty{color:var(--mid);font-size:13.5px;text-align:center;padding:40px 12px;border:1px dashed var(--line);border-radius:12px}

/* IP list */
.iplist{display:grid;gap:10px}
.ip{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;display:grid;
  grid-template-columns:minmax(0,1fr) 360px auto;gap:10px;align-items:center}
.ip h3{font-size:16.5px;font-weight:800}
@media(max-width:1100px){ .ip{grid-template-columns:minmax(0,1fr) auto} .ip .terms{grid-column:1/-1} }
.ip h3{margin:0;font-size:15.5px;letter-spacing:-.01em}
.ip .meta{color:var(--mid);font-size:12.5px;margin-top:3px}
.ip .memo{font-size:13px;margin-top:7px;white-space:pre-wrap}
.dt .memo.now{margin-top:10px;border-left:3px solid #7A5AF8}
.dt .memo.now b{color:#5B3FD6}
.f.now{background:#F7F5FF;border:1px solid #E4DDFB;border-radius:12px;padding:11px 12px 9px}
.f.now>label{color:#5B3FD6;font-weight:800}
.f.now textarea{height:74px}
.nowat{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.nowat>label{font-size:11.5px;color:#7A8497;font-weight:700;margin:0}
.nowat input{width:150px;flex:none}
.nowat .ratehint{margin:0}
.ip .terms{display:flex;flex-direction:column;gap:7px;justify-content:center;
  padding:0 18px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.ip .terms .t{display:flex;align-items:baseline;gap:9px}
.ip .terms .tl{font-size:10.5px;font-weight:800;color:#8A94A6;width:38px;flex:none;letter-spacing:.02em}
.ip .terms b{font-size:13.5px;font-weight:800;color:#22314D;line-height:1.45}
.ip .terms b.none{font-weight:500;color:#A8B0BE}
@media(max-width:960px){
  .ip .terms{border:none;border-top:1px solid var(--line);padding:10px 0 0;min-width:0}
}
.ip .side{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.chip{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:999px;background:#f1f3f7;color:var(--mid)}
.more{position:relative}
.more > summary{list-style:none;cursor:pointer}
.more > summary::-webkit-details-marker{display:none}
.morebox{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:8px;display:flex;flex-direction:column;
  gap:6px;box-shadow:var(--shadow);z-index:20;white-space:nowrap}
.imgrow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start}
.imgprev{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#EEF1F6;
  display:grid;place-items:center;font-size:26px;font-weight:900;color:#B9C4D4}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgbtns{display:flex;flex-direction:column;gap:7px}
.rategrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rategrid .rate{padding:5px 7px}
.rategrid .rate i{font-size:9.5px;letter-spacing:-.3px;white-space:nowrap}
.rategrid .rate input{font-size:12.5px}
.rategrid .rate u{font-size:10.5px}
@media(max-width:420px){.rategrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rate{display:block;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#fff}
.rate span{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.rate i{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--mid)}
.rate input{border:none;outline:none;width:100%;font:inherit;font-size:13.5px;font-weight:700;text-align:right;padding:0}
.rate u{text-decoration:none;font-size:11.5px;color:var(--mid);flex:none}
.ratehint{margin:7px 0 0;font-size:11.5px;color:var(--mid)}
/* 좌우 나눔 : 왼쪽 폴더 탭, 오른쪽 목록 */
.split{display:grid;grid-template-columns:188px minmax(0,1fr);gap:0;align-items:start}
.pane{background:var(--card);border:1px solid var(--line);border-radius:0 14px 14px 14px;
  padding:16px;min-height:420px}
.cattabs{display:flex;flex-direction:column;gap:0;margin:0}
.cattabs button{position:relative;font:inherit;font-size:13.5px;font-weight:700;text-align:left;
  padding:12px 14px;border:1px solid var(--line);border-right:none;border-bottom:none;
  border-radius:12px 0 0 12px;background:#E7E9EF;color:var(--mid);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-right:-1px;
  transition:background .12s,color .12s}
.cattabs button:last-child{border-bottom:1px solid var(--line)}
.cattabs button:hover{background:#EFF0F5;color:var(--ink)}
.cattabs button.on{background:var(--card);color:var(--pink);border-right:1px solid var(--card);
  z-index:2;box-shadow:-2px 0 0 var(--pink) inset}
.cattabs button b{font-weight:800;font-size:11.5px;background:rgba(0,0,0,.07);
  border-radius:999px;padding:1px 7px}
.cattabs button.on b{background:var(--pink-soft);color:var(--pink)}
@media(max-width:820px){
  .split{grid-template-columns:1fr}
  .cattabs{flex-direction:row;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .cattabs button{border:1px solid var(--line);border-radius:999px;margin:0;padding:8px 14px}
  .cattabs button.on{box-shadow:none;background:var(--pink);color:#fff;border-color:var(--pink)}
  .pane{border-radius:14px}
}
.flowwrap{margin-bottom:16px}
.flowwrap > h3{margin:0 0 3px;font-size:12.5px;font-weight:800;color:var(--mid)}
.flowwrap > p{margin:0 0 8px;font-size:11.5px;color:var(--mid)}
.flow{display:flex;flex-wrap:wrap;gap:5px}
.fst{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .12s,background .12s}
.fst:hover{border-color:var(--pink)}
.fst.on{border-color:var(--pink);background:var(--pink-soft)}
.fst .no{font-size:10px;font-weight:900;color:#fff;background:#A7AEBC;border-radius:999px;padding:0 5px}
.fst.sign .no{background:var(--pink)}
.fst b{font-size:12px;font-weight:700}
.fst.on b{color:var(--pink)}
.fst span{display:none}
.fst .cnt{font-size:10.5px;font-weight:800;color:#33405A;background:#EEF1F6;border-radius:999px;padding:0 6px}
.ipgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media(max-width:1100px){.ipgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:760px){.ipgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.ipgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ipc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;display:flex;flex-direction:column}
.ipc:hover{transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(20,28,48,.45);border-color:var(--pink)}
.ipc .ph{position:relative;aspect-ratio:4/5;background:#EEF1F6;overflow:hidden}
.ipc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ipc .ph .ini{position:absolute;inset:0;display:grid;place-items:center;
  font-size:44px;font-weight:900;color:#B9C4D4;letter-spacing:-.03em}
.ipc .ph .sg{position:absolute;left:9px;top:9px;font-size:10.5px;font-weight:800;
  background:rgba(16,24,40,.72);color:#fff;border-radius:999px;padding:3px 9px;backdrop-filter:blur(3px)}
.ipc .ph .addimg{position:absolute;inset:0;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#8A94A6;font:inherit;opacity:0;transition:opacity .12s,background .12s}
.ipc .ph .addimg span{font-size:30px;line-height:1;font-weight:300}
.ipc .ph .addimg u{text-decoration:none;font-size:11.5px;font-weight:700}
.ipc:hover .ph .addimg{opacity:1;background:rgba(255,255,255,.78)}
.ipc .ph .addimg.has{inset:auto 9px 9px auto;width:30px;height:30px;border-radius:999px;
  background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(20,24,40,.18);opacity:0}
.ipc .ph .addimg.has span{font-size:17px}
.ipc:hover .ph .addimg.has{opacity:1}
.ipc .ph .tmp{position:absolute;left:9px;bottom:9px;font-size:10.5px;font-weight:800;
  border-radius:999px;padding:3px 9px;color:#fff}
.tmp.hot{background:#D64545} .tmp.warm{background:#E08A2E} .tmp.mild{background:#7E8AA0}
.tmp.cool{background:#5B8AA8} .tmp.cold{background:#4A5568}
.ipc .ph .ex{position:absolute;right:9px;top:9px;font-size:10.5px;font-weight:800;
  border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.92);color:#5C7291}
.ipc .ph .ex.y{background:#0F6E56;color:#fff}
.ipc .bd{padding:11px 13px 13px}
.ipc h4{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.ipc .own{font-size:11.5px;color:var(--mid);margin-top:2px}
.ipc .kv{margin-top:9px;display:flex;flex-direction:column;gap:4px}
.ipc .kv div{display:flex;gap:7px;align-items:baseline;font-size:11.5px;line-height:1.45}
.ipc .kv i{font-style:normal;font-weight:800;font-size:10px;color:#8A94A6;width:32px;flex:none}
.ipc .kv b{font-weight:700;color:#22314D}
.ipc .kv b.none{font-weight:500;color:#AEB6C4}
.ipc .roy{margin-top:6px;display:flex;gap:7px;font-size:11.5px}
.ipc .roy>i{font-style:normal;font-weight:800;font-size:10px;color:#8A94A6;width:32px;flex:none;line-height:1.45}
.ipc .roy .rl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;min-width:0;flex:1}
.ipc .roy .rl span{font-size:10.5px;font-weight:700;color:#8A94A6;line-height:1.4}
.ipc .roy .rl b{font-weight:700;color:#22314D;font-size:11.5px;line-height:1.4}

/* 자세히 보기 */
.dt{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px}
.dt .dph{aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:#EEF1F6;position:relative}
.dt .dph img{width:100%;height:100%;object-fit:cover;display:block}
.dt .dph .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:900;color:#B9C4D4}
.dt h3{margin:0;font-size:21px;font-weight:900}
.dt .sub{font-size:12.5px;color:var(--mid);margin-top:4px}
.dt .rows{margin-top:14px;display:flex;flex-direction:column;gap:0}
.dt .rows div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;
  padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.dt .rows span{font-size:11.5px;font-weight:700;color:#8A94A6}
.dt .rows b{font-weight:700;color:#22314D}
.dt .memo{margin-top:14px;font-size:13px;white-space:pre-wrap;background:#F5F8FC;
  border:1px solid var(--line);border-radius:10px;padding:11px 13px}
@media(max-width:640px){ .dt{grid-template-columns:1fr} .dt .dph{max-width:200px} }

.modal.wide{width:min(780px,100%)}
.modal.wide h2{display:none}
.modal.wide .sub{display:none}
.cattabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cattabs button{font:inherit;font-size:13.5px;font-weight:700;padding:8px 16px;border-radius:999px;
  border:1.5px solid var(--line);background:#fff;color:var(--mid);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px}
.cattabs button:hover{border-color:var(--pink)}
.cattabs button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.cattabs button b{font-weight:800;font-size:11.5px;background:rgba(0,0,0,.07);border-radius:999px;padding:1px 7px}
.cattabs button.on b{background:rgba(255,255,255,.28)}
.facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.fact{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
      background:#F3F5F8;border:1px solid #E3E8EF;border-radius:6px;padding:2px 8px;color:#33405A}
.fact i{font-style:normal;font-weight:600;font-size:10.5px;color:#8A94A6}
.fact.xy{background:#E7F2EE;border-color:#CFE5DD;color:#0F6E56}
.fact.xn{background:#F2ECF9;border-color:#F2D3D9;color:#B4344F}
.chip.on{background:var(--pink-soft);color:#c2005f}
.stage-sel{padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12.5px}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.col{background:#f7f8fb;border:1px solid var(--line);border-radius:13px;padding:11px;min-height:120px}
.col h3{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;color:var(--mid);font-weight:600}
.mdcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
.mdcard b{display:block;font-size:14px}
.mdcard .m{color:var(--mid);font-size:12px;margin-top:3px}
.mdcard .due{font-size:12px;margin-top:5px}
.mdcard .due.late{color:var(--pink);font-weight:600}
.mdcard .mv{display:flex;gap:5px;margin-top:9px}
.mdcard .mv button{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font-size:12px}
.mdcard .mv .sp{flex:1}

/* docs */
.doc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.doc b{font-size:14.5px}
.doc .m{color:var(--mid);font-size:12.5px;margin-top:2px}

/* 유입 경로 뱃지 */
.ipc .ph .sr{position:absolute;right:9px;bottom:9px;font-size:10.5px;font-weight:800;
  border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.92);color:#5C7291}
.ipc .ph .sr.in{background:#1F5FBF;color:#fff}

/* MD 카드 사진 */
.mdcard .mph{position:relative;aspect-ratio:16/10;background:#EEF1F6;border-radius:9px;overflow:hidden;margin-bottom:9px}
.mdcard .mph img{width:100%;height:100%;object-fit:cover;display:block}
.mdcard .mph .addimg{position:absolute;inset:0;border:none;cursor:pointer;font:inherit;color:#8A94A6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:transparent;transition:opacity .12s,background .12s}
.mdcard .mph .addimg span{font-size:26px;line-height:1;font-weight:300}
.mdcard .mph .addimg u{text-decoration:none;font-size:11px;font-weight:700}
.mdcard .mph .addimg.has{inset:auto 7px 7px auto;width:28px;height:28px;border-radius:999px;
  background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(20,24,40,.18);opacity:0}
.mdcard .mph .addimg.has span{font-size:16px}
.mdcard:hover .mph .addimg.has{opacity:1}

/* 로열티 정산 */
.roysum{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.roysum .rs{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.roysum .rs b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.roysum .rs .n{display:flex;justify-content:space-between;font-size:12px;color:var(--mid);margin-top:7px}
.roysum .rs .n em{font-style:normal;font-weight:700;color:#22314D}
.roysum .rs .gz{height:6px;border-radius:999px;background:#EDF0F5;margin-top:8px;overflow:hidden}
.roysum .rs .gz i{display:block;height:100%;background:var(--pink)}
.roysum .rs .gz i.over{background:#0F6E56}
.rwrap{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:auto}
table.rtbl{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
table.rtbl th{text-align:left;font-size:11px;font-weight:800;color:#8A94A6;padding:10px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap}
table.rtbl td{padding:10px 12px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
table.rtbl tr:last-child td{border-bottom:0}
table.rtbl tr:hover td{background:#fafbfd}
table.rtbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#22314D;white-space:nowrap}
table.rtbl td.ipn{font-weight:700}
.rst{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:#f1f3f7;color:var(--mid)}
.rst.s1{background:#FFF3D6;color:#8A6300}
.rst.s2{background:#E7F2EE;color:#0F6E56}
.rgh{display:flex;align-items:center;gap:10px;margin:18px 2px 8px}
.rgh:first-child{margin-top:0}
.rgh b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.rgh span{flex:1;font-size:12px;color:var(--mid)}
table.rtbl tr.tot td{background:#f7f8fb;font-weight:800;border-top:1px solid var(--line)}
table.rtbl tr.tot:hover td{background:#f7f8fb}

/* modal */

<body>

<div id="gate">
  <div class="box">
    <h1>IP 관련 업무</h1>
    <p>접근 코드를 입력해 주세요</p>
    <input id="gateInput" inputmode="numeric" maxlength="4" placeholder="····" aria-label="접근 코드">
    <div class="err" id="gateErr"></div>
    <button id="gateBtn">들어가기</button>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="in">
      <div class="brand"><span class="dot"></span><b>IP 관리</b></div>
      <a class="back" href="/marketing/">← 마케팅 실무</a>
      <div class="views" role="group" aria-label="보기 전환">
        <button id="tIp" aria-pressed="true">IP 후보</button>
        <button id="tMd" aria-pressed="false">MD 현황판</button>
        <button id="tRoy" aria-pressed="false">로열티 정산</button>
        <button id="tDoc" aria-pressed="false">자료함</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <!-- IP -->
    <section id="secIp">
      <div class="flowbox" id="flowBox"></div>
      <div class="split">
      <div class="cattabs" id="catTabs"></div>
      <div class="pane">
      <div class="bar">
        <button class="btn pink" id="addIp">IP 후보 추가</button>
        <select class="s" id="fStage"><option value="">모든 단계</option></select>
        <select class="s" id="fSrc" title="누가 먼저 연락했는지로 거르기"><option value="">모든 유입</option></select>
        <span class="grow"><input class="s" id="fQ" placeholder="이름, 담당사, 메모에서 찾기"></span>
        <span class="chip" id="syncChip" title="팀 저장소 연결 상태">확인 중…</span>
        <span class="chip" id="lastChip">마지막 저장 —</span>
        <button class="btn pink" id="saveBtn">저장</button>
        <details class="more"><summary class="btn">백업</summary>
          <div class="morebox">
            <button class="btn" id="expJson">백업 저장</button>

      </div>
      </div>

    <!-- MD -->
    <section id="secMd" class="hidden">
      <div class="bar">
        <button class="btn pink" id="addMd">상품 추가</button>

    </section>

    <!-- ROY -->

        <button class="btn pink" id="addRoy">정산 내역 추가</button>
        <button class="btn" id="royUp">엑셀 올리기</button>
        <button class="btn" id="royDown">엑셀 내려받기</button>
        <select class="s" id="fRoyIp"><option value="">모든 IP</option></select>
        <select class="s" id="fRoyPeriod"><option value="">모든 기간</option></select>
        <select class="s" id="fRoyState"><option value="">모든 상태</option></select>
        <span class="grow"><input class="s" id="fRoyQ" placeholder="제품명, 기간, 메모에서 찾기"></span>
        <span class="chip" id="royCount"></span>
      </div>
      <div class="roysum" id="roySum"></div>
      <div id="royWrap"></div>
      <p class="sub" style="color:var(--mid);font-size:12.5px;margin-top:14px">
        늘 쓰시던 정산 리스트 엑셀을 그대로 올리면 제품별로 읽어 들입니다.
        출하가가 있으면 <b>제작수량 × 출하가 × 로열티율</b>, 출하가가 비어 있고 판매가만 있으면
        <b>판매가 ÷ 1.1 (반올림) × 로열티율 × 제작수량</b> 으로 셉니다. 내려받으면 같은 양식으로 나옵니다.
      </p>
    </section>

    <!-- DOC -->
    <section id="secDoc" class="hidden">
      <div class="bar">
        <button class="btn pink" id="addDoc">자료 추가</button>
        <select class="s" id="fDocIp"><option value="">모든 IP</option></select>
        <select class="s" id="fDocType"><option value="">모든 종류</option></select>
        <span class="grow"><input class="s" id="fDocQ" placeholder="제목에서 찾기"></span>
      </div>
      <div id="docWrap"></div>
      <p class="sub" style="color:var(--mid);font-size:12.5px;margin-top:14px">
        파일은 이 브라우저 안에만 저장됩니다. 용량이 큰 제안서는 드라이브에 올리고 링크로 걸어 두는 편이 안전해요.
      </p>
    </section>
  </div>
</div>

<script>
(function(){
"use strict";
var PASS="2701", LS="brkg_ip_v1";
var STAGES=["발굴","내부 검토","제안 발송","회신·미팅","딜 조건 협의","계약서 검토",
            "사인","디자인 감수","샘플·증지","양산","출시","보류","종료"]
var FLOW=[
 ["발굴","후보를 찾아 목록에 올림"],
 ["내부 검토","우리 브랜드와 맞는지 따져봄"],
 ["제안 발송","제안서·소개서를 보냄"],
 ["회신·미팅","답이 와서 만나거나 통화함"],
 ["딜 조건 협의","MG·로열티율·독점 범위·기간을 맞춤"],
 ["계약서 검토","법무·내부 검토와 수정"],
 ["사인","계약 체결 · 여기부터 제작기간을 셈"],
 ["디자인 감수","시안을 원작사에 올려 승인받음"],
 ["샘플·증지","샘플 확인과 증지 발급"],
 ["양산","생산 들어감"],
 ["출시","판매 시작"]
]
var GRPS=["연간","월간 FOM","제안·검토"]
var TEMPS=[["hot","뜨거움","먼저 연락 올 만큼 적극적"],
           ["warm","좋음","대화가 잘 되고 진척이 있음"],
           ["mild","보통","오가는 중 · 특별한 신호 없음"],
           ["cool","서먹","답이 느리거나 미지근함"],
           ["cold","막힘","거절했거나 연락이 끊김"]];
function tempOf(k){ for(var i=0;i<TEMPS.length;i++) if(TEMPS[i][0]===k) return TEMPS[i]; return null; };
var CATS=["캐릭터","패션","셀럽","기타"];
var MD_STAGES=["기획","디자인","샘플","양산","출시"]
var EXCL=["독점","비독점","확인 필요"];
var DOC_TYPES=["제안서","시안","견적","계약","회신 기록","기타"];
/* 유입 경로 — 누가 먼저 연락했는지 */
var SRCS=[["in","인바운드","상대가 먼저 우리에게 제안해 온 건"],
          ["out","아웃바운드","우리가 먼저 찾아가 제안한 건"]];
function srcOf(k){ for(var i=0;i<SRCS.length;i++) if(SRCS[i][0]===k) return SRCS[i]; return null; }
var ROY_STATES=["청구 전","청구함","입금됨"];

/* gate */
var gate=document.getElementById("gate"), app=document.getElementById("app");
function opened(){
  return sessionStorage.getItem("br_ip_ok")==="1"||sessionStorage.getItem("br_all_ok")==="1";
}
function openApp(){ gate.classList.add("hidden"); app.classList.remove("hidden"); boot(); }
function tryGate(){
  if(document.getElementById("gateInput").value.trim()===PASS){ sessionStorage.setItem("br_ip_ok","1"); sessionStorage.setItem("br_all_ok","1"); openApp(); }
  else { document.getElementById("gateErr").textContent="코드가 맞지 않습니다."; document.getElementById("gateInput").select(); }
}
document.getElementById("gateBtn").addEventListener("click", tryGate);
document.getElementById("gateInput").addEventListener("keydown", function(e){ if(e.key==="Enter") tryGate(); });

/* file store */
var DB=null;
function db(){ return new Promise(function(res,rej){
  if(DB) return res(DB);
  var r=indexedDB.open("brkg_ip",1);
  r.onupgradeneeded=function(){ r.result.createObjectStore("files"); };
  r.onsuccess=function(){ DB=r.result; res(DB); };
  r.onerror=function(){ rej(r.error); };
});}
function filePut(k,v){ return db().then(function(d){ return new Promise(function(res,rej){
  var t=d.transaction("files","readwrite"); t.objectStore("files").put(v,k);
  t.oncomplete=function(){res()}; t.onerror=function(){rej(t.error)}; });});}
function fileGet(k){ return db().then(function(d){ return new Promise(function(res,rej){
  var q=d.transaction("files","readonly").objectStore("files").get(k);
  q.onsuccess=function(){res(q.result||null)}; q.onerror=function(){rej(q.error)}; });}).catch(function(){return null;});}
function fileDel(k){ return db().then(function(d){ return new Promise(function(res){
  var t=d.transaction("files","readwrite"); t.objectStore("files").delete(k); t.oncomplete=function(){res()}; });}).catch(function(){});}

/* state */
var data={ips:[],md:[],docs:[],roy:[]};
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
/* ================= 팀 저장소 (구글 시트) =================
   brkg-data-apps-script.txt 를 새 스프레드시트의 Apps Script 에 붙여넣고
   웹 앱으로 배포한 뒤, 나온 .../exec 주소를 아래 따옴표 안에 넣어 주세요.
   비워 두면 지금처럼 이 브라우저에만 저장됩니다.                        */
var DATA_URL = "https://script.google.com/macros/s/AKfycbwa42Avu6K35gUEB1MW2e-5Pcu6WKnHaL9Qh_QgfhxQ0myuNHGjIyHuu2emqcl7Sd-JPQ/exec";
try{ var _u=localStorage.getItem("brkg_data_url"); if(_u) DATA_URL=_u; }catch(e){}

var TBL={ips:"ip", md:"md", docs:"docs", roy:"roy"};      /* 화면 이름 → 시트 이름 */
var syncOn=false, lastIds={ips:[],md:[],docs:[],roy:[]}, pushTimer=null;

function chip(t,c){ var el=document.getElementById("syncChip"); if(!el) return;
  el.textContent=t; el.style.background = c==="ok" ? "#E7F2EE" : (c==="err" ? "#FDE7F3" : "");
  el.style.color = c==="ok" ? "#0F6E56" : (c==="err" ? "#9E0060" : ""); }

var _cb=0;
function apiGet(params){
  return new Promise(function(res,rej){
    var cb="brkipcb"+(++_cb)+"_"+Date.now(), sc=document.createElement("script"), done=false;
    var t=setTimeout(function(){ fin(); rej(new Error("시간 초과")); },15000);
    function fin(){ if(done)return; done=true; clearTimeout(t);
      try{delete window[cb]}catch(e){window[cb]=undefined}
      if(sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb]=function(d){ fin(); res(d); };
    var q=[]; for(var k in params) q.push(encodeURIComponent(k)+"="+encodeURIComponent(params[k]));
    q.push("callback="+cb);
    sc.src=DATA_URL+(DATA_URL.indexOf("?")<0?"?":"&")+q.join("&");
    sc.onerror=function(){ fin(); rej(new Error("주소를 열지 못했습니다")); };
    document.head.appendChild(sc);
  });
}
function apiPost(obj){
  return fetch(DATA_URL,{method:"POST",mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)});
}

function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(data)); }
  catch(e){ toast("이 브라우저 저장 공간이 가득 찼습니다. 큰 파일은 링크로 걸어 주세요."); } }

/*  대표 이미지를 드라이브로 옮긴다.
 *  사진을 글자로 바꿔 시트 칸에 넣으면 칸 한도(5만 자)를 넘겨 저장이 깨진다.
 *  드라이브에 올리고 시트에는 주소만 남긴다.  */
var imgLiftOff=false;
function uploadImg(ip){
  var body=JSON.stringify({type:"ipphoto", ipId:ip.id, data:ip.img,
                           mime:"image/jpeg", name:(ip.name||"ip")+".jpg"});
  var hd={"Content-Type":"text/plain;charset=utf-8"};
  return fetch(DATA_URL,{method:"POST",headers:hd,body:body})
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j && j.url) ip.img=j.url; })
    .catch(function(){
      /* 브라우저가 답을 못 읽는 경우 : 그냥 보내 두고, 시트에 적힌 주소를 다시 읽어 온다 */
      return fetch(DATA_URL,{method:"POST",mode:"no-cors",headers:hd,body:body})
        .then(function(){ return apiGet({action:"list",table:"ip"}); })
        .then(function(r){
          var row=((r&&r.rows)||[]).filter(function(x){ return x.id===ip.id; })[0];
          if(row && /^https?:/.test(row.img||"")) ip.img=row.img;
        })
        .catch(function(){ imgLiftOff=true; });   /* 끝내 막히면 이 브라우저에만 둔다 */
    });
}
function liftImages(){
  if(imgLiftOff) return Promise.resolve();
  /* 사진은 4만 자 아래로 줄여 넣으므로 시트 칸(5만 자)에 그대로 들어간다.
     한도를 넘는 아주 큰 것만 드라이브로 옮긴다. */
  var big=data.ips.filter(function(i){ return /^data:/.test(i.img||"") && i.img.length>45000; });
  if(!big.length) return Promise.resolve();
  chip("이미지 올리는 중…","");
  var p=Promise.resolve();
  big.forEach(function(ip){ p=p.then(function(){ return imgLiftOff? null : uploadImg(ip); }); });
  return p.then(function(){ saveLocal(); renderIps(); });
}

var lastSent={};   /* 표별로 마지막에 올린 내용. 그대로면 다시 올리지 않습니다. */
function pushAll(){
  if(!syncOn) return;
  chip("올리는 중…","");
  liftImages().then(pushRows);
}
function pushRows(){
  chip("올리는 중…","");
  var jobs=[], sending={};
  Object.keys(TBL).forEach(function(k){
    var recs=data[k].map(function(r){ var c={}; for(var f in r) if(f!=="file") c[f]=r[f]; return c; });
    var snap=JSON.stringify(recs);
    sending[k]=snap;
    if(recs.length && snap!==lastSent[k]) jobs.push(apiPost({type:"saveMany", table:TBL[k], recs:recs}));
    var now=recs.map(function(r){return r.id});
    lastIds[k].forEach(function(id){ if(now.indexOf(id)<0) jobs.push(apiPost({type:"delete",table:TBL[k],id:id})); });
    lastIds[k]=now;
  });
  if(!jobs.length){ chip("팀 저장소에 올림","ok"); return; }
  Promise.all(jobs)
    .then(function(){ lastSent=sending; chip("팀 저장소에 올림","ok"); })
    .catch(function(){ lastSent={}; chip("올리지 못함 — 이 브라우저에만 있음","err"); });
}

var dirty=false, seenStamp="";

/* 고친 내용은 이 브라우저에만 둡니다. 팀에 올리려면 저장 버튼을 눌러야 합니다. */
function save(){ saveLocal(); dirty=true; markDirty(); }

function markDirty(){
  var b=document.getElementById("saveBtn"); if(!b) return;
  b.textContent = dirty ? "저장 (안 한 변경 있음)" : "저장";
  b.style.opacity = dirty ? "1" : ".6";
}
function whoAmI(){
  var n="";
  try{ n=localStorage.getItem("brkg_user")||""; }catch(e){}
  if(!n){
    n=(prompt("저장한 사람을 남깁니다. 이름을 적어 주세요.")||"").trim();
    if(!n) return "";
    try{ localStorage.setItem("brkg_user",n); }catch(e){}
  }
  return n;
}
function stampText(m){
  if(!m||!m.at) return "마지막 저장 —";
  var d=new Date(m.at);
  var t=isNaN(d)?String(m.at).slice(0,16):
        (d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  return "마지막 저장 "+(m.by||"?")+" · "+t;
}
function showStamp(m){
  var el=document.getElementById("lastChip");
  if(el) el.textContent=stampText(m);
}

/* 저장 — 화면에 있는 내용으로 팀 저장소를 통째로 덮어씁니다 (마지막에 누른 사람 것이 남음) */
function saveNow(){
  if(!DATA_URL || !syncOn){
    saveLocal(); dirty=false; markDirty();
    alert("팀 저장소에 연결되어 있지 않습니다.\n이 브라우저에만 저장했습니다.\n\n" +
          "오른쪽 «연결 안 됨» 표시에 마우스를 올리면 이유가 나옵니다.\n" +
          "그 전까지는 «백업 저장»으로 파일을 받아 두시면 됩니다.");
    return;
  }
  var me=whoAmI(); if(!me) return;
  chip("다른 사람 저장 확인 중…","");
  apiGet({action:"list",table:"meta"}).then(function(r){
    var cur=((r&&r.rows)||[]).filter(function(x){return x.id==="ip"})[0];
    if(cur && seenStamp && String(cur.updated||"")>seenStamp){
      if(!confirm("내가 화면을 연 뒤에 "+(cur.by||"다른 사람")+"님이 저장했습니다.\n" +
                  "지금 저장하면 그 내용은 사라지고 이 화면 내용만 남습니다.\n계속할까요?")){
        chip("저장 안 함","err"); return;
      }
    }
    doSave(me);
  }).catch(function(){ doSave(me); });
}
function doSave(me){
  var at=new Date().toISOString();
  pushAll();
  apiPost({type:"save",table:"meta",
           rec:{id:"ip",by:me,at:at,n:data.ips.length,updated:at}})
    .then(function(){
      dirty=false; markDirty(); seenStamp=at; showStamp({by:me,at:at});
      toast("저장했습니다 · IP "+data.ips.length+"건");
    })
    .catch(function(){ alert("저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요."); });

function pull(){
  if(!DATA_URL){
    lastSyncErr="DATA_URL 이 비어 있습니다";
    chip("이 브라우저에만 저장됨","err");
    var c0=document.getElementById("syncChip");
    if(c0) c0.title="ip/index.html 의 var DATA_URL 에 Apps Script 배포 주소를 넣어 주세요.";

  }
  chip("불러오는 중…","");
  return apiGet({action:"all"}).then(function(r){
    if(!r || !r.ok) throw new Error(r && r.error || "응답이 이상합니다");
    syncOn=true;

      var remote=r.data[TBL[k]]||[], byId={};

          if(mine && mine.img && !x.img) x.img=mine.img;
          byId[x.id]=x;
        }
      });
      data[k]=Object.keys(byId).map(function(id){ return byId[id]; });
      lastIds[k]=data[k].map(function(x){ return x.id; });
    });
    saveLocal();
    remoteEmpty = !((r.data[TBL.ips]||[]).length || (r.data[TBL.md]||[]).length || (r.data[TBL.docs]||[]).length || (r.data[TBL.roy]||[]).length);
    chip("팀 저장소 연결됨","ok");
    return apiGet({action:"list",table:"meta"}).then(function(r2){
      var m=((r2&&r2.rows)||[]).filter(function(x){return x.id==="ip"})[0];
      if(m){ seenStamp=String(m.updated||m.at||""); showStamp(m); }
    }).catch(function(){});
  }).catch(function(e){
    syncOn=false;
    lastSyncErr=(e && e.message) || "알 수 없는 오류";
    chip("연결 안 됨 — 눌러서 다시 시도","err");
    var c=document.getElementById("syncChip");
    if(c){
      c.title="이유: "+lastSyncErr+
        "\n주소: "+(DATA_URL? DATA_URL.slice(0,64)+"…" : "(비어 있음)")+
        "\n눌러서 다시 시도합니다.";
      c.style.cursor="pointer";
      c.onclick=function(){ chip("다시 해보는 중…",""); pull().then(redrawAll); };
    }
  });
}

var RATEKEYS=[["ic","아이스크림"],["cake","케이크"],["dessert","디저트"],["drink","음료"],["goods","굿즈"]];
var RATEPAT={ic:/아이스크림/, cake:/케이[크익]/, dessert:/디저트/, drink:/음료|쉐이크/, goods:/굿즈|MD/};

/* 예전에 적어 둔 로열티 글에서 품목별 %를 뽑아낸다 */
function parseRates(v){
  var out={};
  String(v||"").split(/\s*\/\s*/).forEach(function(x){
    RATEKEYS.forEach(function(k){
      if(out[k[0]]) return;
      if(!RATEPAT[k[0]].test(x)) return;
      var ps=(x.match(/[\d.]+\s*%/g)||[]).map(function(y){return y.replace(/\s+/g,"")});
      if(!ps.length) return;
      var u=ps.filter(function(y,i){return ps.indexOf(y)===i});
      out[k[0]] = (u.length>1) ? u[0].replace("%","")+"~"+u[u.length-1].replace("%","") : u[0].replace("%","");
    });
  });
  return out;
}
/* 품목별 %를 보기 좋은 한 줄로 */
function ratesText(r){
  if(!r) return "";
  var lab={ic:"IC",cake:"케이크",dessert:"디저트",drink:"음료",goods:"굿즈"};
  return RATEKEYS.map(function(k){
    var v=r[k[0]]; return v? lab[k[0]]+" "+v+"%" : "";
  }).filter(Boolean).join(" · ");
}

function shortMg(v){
  v=String(v||"").trim();
  if(!v||/^(TBD|N\/A|미정)$/i.test(v)) return "";
  if(/상기/.test(v)) return "연간 계약 포함";
  var nums=[];
  v.split(/\s*\/\s*/).forEach(function(x){
    var m=x.match(/([\d,.]+\s*(?:억|만원|만|K\s*USD|USD|원))/i);
    if(m) nums.push(m[1].replace(/만원/,"만").replace(/\s+/g,"").replace(/KUSD/i,"K USD"));
  });
  return nums.length?nums.join(" + "):(v.length>14?v.slice(0,14)+"…":v);
}
var ROYMAP=[[/아이스크림/,"IC"],[/케이[크익]/,"케이크"],[/디저트/,"디저트"],[/음료|쉐이크/,"음료"],[/굿즈|MD/,"굿즈"]];
function shortRoy(v,rates){
  var t=ratesText(rates); if(t) return t;
  v=String(v||"").trim();
  if(!v||/^(TBD|N\/A|미정)$/i.test(v)) return "";
  var out=[],seen={};
  v.split(/\s*\/\s*/).forEach(function(x){
    var nm="";
    for(var i=0;i<ROYMAP.length;i++){ if(ROYMAP[i][0].test(x)){ nm=ROYMAP[i][1]; break; } }
    var ps=(x.match(/[\d.]+\s*%/g)||[]).map(function(y){return y.replace(/\s+/g,"")});
    if(!nm||!ps.length||seen[nm]) return;
    var u=ps.filter(function(y,i){return ps.indexOf(y)===i});
    seen[nm]=1;
    out.push(nm+" "+(u.length>1?u[0].replace("%","")+"~"+u[u.length-1]:u[0]));
  });
  return out.length?out.join(" · "):(v.length>18?v.slice(0,18)+"…":v);
}

/* 로열티를 [이름, 비율] 짝으로 돌려준다. 카드에서 세로로 줄 맞춰 보여주기 위함. */
function royRows(v, rates){
  var lab={ic:"IC",cake:"케이크",dessert:"디저트",drink:"음료",goods:"굿즈"};
  var out=[];
  if(rates){
    RATEKEYS.forEach(function(k){ var x=rates[k[0]]; if(x) out.push([lab[k[0]], x+"%"]); });
    if(out.length) return out;
  }
  v=String(v||"").trim();
  if(!v||/^(TBD|N\/A|미정)$/i.test(v)) return [];
  var seen={};
  v.split(/\s*\/\s*/).forEach(function(x){
    var nm="";
    for(var i=0;i<ROYMAP.length;i++){ if(ROYMAP[i][0].test(x)){ nm=ROYMAP[i][1]; break; } }
    var ps=(x.match(/[\d.]+\s*%/g)||[]).map(function(y){return y.replace(/\s+/g,"")});
    if(!nm||!ps.length||seen[nm]) return;
    var u=ps.filter(function(y,i){return ps.indexOf(y)===i});
    seen[nm]=1;
    out.push([nm, u.length>1? u[0].replace("%","")+"~"+u[u.length-1] : u[0]]);
  });
  return out;
}

var curCat="";
function shortPoc(v){
  v=String(v||"").trim(); if(!v) return "";
  var names=[];
  v.split(/\s*\/\s*/).forEach(function(x){
    x=x.replace(/\([^)]*\)/g,"").replace(/[\w.+-]+@[\w.-]+/g,"")
       .replace(/[\d][\d\s-]{7,}/g,"").replace(/^\s*(로열티|디자인|계약)\s*:\s*/,"")
       .replace(/[\/,·(){}\[\]]+/g," ").replace(/\s+/g," ").trim();
    if(x && x.length<=16 && /[가-힣A-Za-z]/.test(x) && names.indexOf(x)<0) names.push(x);
  });
  return names.length? names.slice(0,2).join(" · ") : "연락처 있음";
}

  var mdN=data.md.filter(function(m){return m.ipId===i.id}).length;

  var msg=i.name+"을(를) 지울까요?";

/* 사진을 칸 하나에 들어갈 만큼 작게 줄인다 (시트 한 칸 5만 자 제한) */
function shrinkImg(f, maxPx, budget){
  maxPx=maxPx||320; budget=budget||40000;
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error("파일을 읽지 못했습니다")); };
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){ rej(new Error("사진이 아닌 것 같습니다")); };
      img.onload=function(){
        var w=img.width,h=img.height;
        if(Math.max(w,h)>maxPx){ var r=maxPx/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        var q=0.72, out=cv.toDataURL("image/jpeg",q);
        while(out.length>budget && q>0.35){ q-=0.08; out=cv.toDataURL("image/jpeg",q); }
        if(out.length>budget){          /* 그래도 크면 한 번 더 줄인다 */
          var w2=Math.round(w*0.75), h2=Math.round(h*0.75);
          cv.width=w2; cv.height=h2;
          cv.getContext("2d").drawImage(img,0,0,w2,h2);
          out=cv.toDataURL("image/jpeg",0.6);
        }
        res(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
}

/* 어디서든 부르는 대표 이미지 고르기 · redraw 를 주면 그 화면을 다시 그린다 */
function pickImage(ip, after, redraw){
  var f=document.createElement("input");
  f.type="file"; f.accept="image/*"; f.style.display="none";
  document.body.appendChild(f);
  f.onchange=function(){
    var file=this.files[0]; document.body.removeChild(f);
    if(!file) return;
    if(!/^image\//.test(file.type)){ toast("사진 파일만 넣을 수 있습니다."); return; }
    toast("이미지를 줄이는 중…");
    shrinkImg(file).then(function(dataUrl){
      ip.img=dataUrl; ip.updated=new Date().toISOString();
      save(); (redraw||renderIps)();
      toast("사진을 넣었습니다.");
      if(after) after(dataUrl);
    }).catch(function(e){ toast(e.message||"넣지 못했습니다."); });
  };
  f.click();
}

/* ---------- 로열티 정산 ---------- */
/*  늘 쓰시는 «[부서별] IP 로열티 정산 리스트» 양식을 그대로 담습니다.
    한 줄 = 제품 한 개.  셈은 엑셀에 있던 두 가지 식을 그대로 씁니다.
      · 출하가가 있으면        : 제작수량 × 출하가 × 로열티율
      · 출하가가 비어 있으면   : 반올림(판매가 ÷ 1.1) × 로열티율 × 제작수량        */

/* 적어 둔 MG 글에서 돈 액수를 뽑아 원 단위 숫자로 바꾼다. 못 읽으면 0. */
function parseWon(v){
  var s=String(v||"").replace(/\s+/g,"");
  if(!s||/^(TBD|N\/A|미정)$/i.test(s)) return 0;
  var sum=0, hit=false;
  s.replace(/([\d,.]+)\s*(억|만원|만|원)?/g, function(all,n,unit){
    var x=parseFloat(String(n).replace(/,/g,""));
    if(isNaN(x)) return all;
    if(unit==="억") x*=100000000;
    else if(unit==="만원"||unit==="만") x*=10000;
    else if(unit!=="원") return all;      /* 단위가 없으면 액수로 보지 않는다 */
    sum+=x; hit=true; return all;
  });
  return hit? sum : 0;
}
function num(v){ var n=parseFloat(String(v==null?"":v).replace(/[^\d.\-]/g,"")); return isNaN(n)?0:n; }
function won(n){ return Math.round(+n||0).toLocaleString("ko-KR"); }
function wonShort(n){
  n=Math.round(+n||0);
  if(!n) return "0원";
  if(n>=100000000) return (Math.round(n/1000000)/100).toLocaleString("ko-KR")+"억원";
  if(n>=10000) return Math.round(n/10000).toLocaleString("ko-KR")+"만원";
  return n.toLocaleString("ko-KR")+"원";
}

/* 한 줄의 합계 — 엑셀 식과 똑같이 */
function royAmount(r){
  var qty=num(r.qty), rate=num(r.rate)/100;
  if(num(r.ship)>0) return qty*num(r.ship)*rate;
  if(num(r.price)>0) return Math.round(num(r.price)/1.1)*rate*qty;
  return 0;
}
/* 그 IP에 적어 둔 품목별 요율 중 굿즈 값을 기본으로 끌어온다 */
function defaultRate(ipId){
  var ip=data.ips.filter(function(x){return x.id===ipId})[0];
  if(!ip||!ip.rates) return "";
  var v=ip.rates.goods||ip.rates.ic||ip.rates.cake||ip.rates.dessert||ip.rates.drink||"";
  return v? String(v).split("~")[0].replace(/[^\d.]/g,"") : "";
}
function periodsOf(){
  var seen={}, out=[];
  data.roy.forEach(function(r){ var p=r.period||""; if(p&&!seen[p]){ seen[p]=1; out.push(p); } });
  out.sort(function(a,b){ return String(b).localeCompare(String(a)); });
  return out;
}

function renderRoy(){
  var wrap=document.getElementById("royWrap"); wrap.innerHTML="";
  var sumBox=document.getElementById("roySum"); sumBox.innerHTML="";
  var fi=document.getElementById("fRoyIp").value;
  var fp=document.getElementById("fRoyPeriod").value;
  var fs=document.getElementById("fRoyState").value;
  var q=document.getElementById("fRoyQ").value.trim().toLowerCase();

  var list=data.roy.filter(function(r){
    if(fi&&r.ipId!==fi) return false;
    if(fp&&(r.period||"")!==fp) return false;
    if(fs&&(r.state||"청구 전")!==fs) return false;
    if(q){
      var hay=((r.item||"")+" "+(r.period||"")+" "+(r.memo||"")+" "+ipName(r.ipId)).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });

  var total=list.reduce(function(s,r){ return s+royAmount(r); },0);
  document.getElementById("royCount").textContent="모두 "+list.length+"줄 · "+wonShort(total);

  /* IP별 요약 — 정산액 합계와 MG 채운 정도 */
  var byIp={};
  data.roy.forEach(function(r){
    if(fi&&r.ipId!==fi) return;
    var k=r.ipId||"";
    if(!byIp[k]) byIp[k]={sum:0,paid:0,n:0};
    byIp[k].sum+=royAmount(r); byIp[k].n++;
    if((r.state||"")==="입금됨") byIp[k].paid+=royAmount(r);
  });
  Object.keys(byIp).forEach(function(k){
    var ip=data.ips.filter(function(x){return x.id===k})[0];
    var s=byIp[k], mg=ip? parseWon(ip.mg) : 0;
    var box=document.createElement("div"); box.className="rs";
    var t=document.createElement("b"); t.textContent=(ip&&ip.name)||"IP 없음"; box.appendChild(t);
    function line(lab,v){
      var d=document.createElement("div"); d.className="n";
      var a=document.createElement("span"); a.textContent=lab;
      var b=document.createElement("em"); b.textContent=v;
      d.appendChild(a); d.appendChild(b); box.appendChild(d);
    }
    line("정산액 합계", wonShort(s.sum));
    line("입금된 금액", wonShort(s.paid));
    line("제품 줄 수", s.n+"줄");
    if(mg){
      line("MG", wonShort(mg));
      var pct=Math.min(100, Math.round(s.sum/mg*100));
      var gz=document.createElement("div"); gz.className="gz";
      var bar=document.createElement("i");
      bar.style.width=pct+"%";
      if(s.sum>=mg) bar.className="over";
      gz.appendChild(bar); box.appendChild(gz);
      var d2=document.createElement("div"); d2.className="n";
      var a2=document.createElement("span");
      a2.textContent = s.sum>=mg ? "MG 다 채움 · 넘은 금액" : "MG 채운 정도";
      var b2=document.createElement("em");
      b2.textContent = s.sum>=mg ? wonShort(s.sum-mg) : pct+"%";
      d2.appendChild(a2); d2.appendChild(b2); box.appendChild(d2);
    }
    sumBox.appendChild(box);
  });

  if(!list.length){
    var e=document.createElement("div"); e.className="empty";
    e.textContent=data.roy.length? "조건에 맞는 정산 내역이 없습니다."
                                 : "아직 넣은 정산 내역이 없습니다. «엑셀 올리기»로 늘 쓰시던 파일을 그대로 올려 보세요.";
    wrap.appendChild(e); return;
  }

  /* IP · 기간 묶음별로 엑셀과 같은 표를 하나씩 그린다 */
  var groups={}, order=[];
  list.forEach(function(r){
    var k=(r.ipId||"")+"|"+(r.period||"");
    if(!groups[k]){ groups[k]=[]; order.push(k); }
    groups[k].push(r);
  });
  order.sort(function(a,b){
    var pa=a.split("|")[1], pb=b.split("|")[1];
    return String(pb).localeCompare(String(pa));
  });

  order.forEach(function(k){
    var rows=groups[k].slice();
    rows.sort(function(a,b){ return (num(a.no)||9999)-(num(b.no)||9999); });
    var ipId=k.split("|")[0], period=k.split("|")[1];

    var head=document.createElement("div"); head.className="rgh";
    var h=document.createElement("b");
    h.textContent=(ipName(ipId)||"IP 없음")+(period? "  ·  "+period : "");
    head.appendChild(h);
    var hs=document.createElement("span");
    hs.textContent=rows.length+"줄 · 총합계 "+won(rows.reduce(function(s,r){return s+royAmount(r)},0))+"원";
    head.appendChild(hs);
    var dl=document.createElement("button"); dl.className="btn sm"; dl.textContent="이 표만 엑셀로";
    dl.onclick=function(){ exportRoy(rows, ipName(ipId), period); };
    head.appendChild(dl);
    wrap.appendChild(head);

    var box2=document.createElement("div"); box2.className="rwrap";
    var tb=document.createElement("table"); tb.className="rtbl";
    var hr=document.createElement("tr");
    ["No.","제품명","제작수량","출하가","판매가","로열티율","합계","상태","메모",""].forEach(function(t2){
      var th=document.createElement("th"); th.textContent=t2; hr.appendChild(th);
    });
    var thead=document.createElement("thead"); thead.appendChild(hr); tb.appendChild(thead);

    var tbody=document.createElement("tbody");
    rows.forEach(function(r,idx){
      var tr=document.createElement("tr");
      function cell(txt,cls){
        var td=document.createElement("td"); if(cls) td.className=cls;
        td.textContent=txt; tr.appendChild(td); return td;
      }
      cell(r.no||(idx+1),"num");
      cell(r.item||"—","ipn");
      cell(num(r.qty)? won(r.qty) : "—","num");
      cell(num(r.ship)? won(r.ship)+"원" : "—","num");
      cell(num(r.price)? won(r.price)+"원" : "—","num");
      cell(num(r.rate)? r.rate+"%" : "—","num");
      cell(won(royAmount(r))+"원","num");

      var st=r.state||"청구 전";
      var tdS=document.createElement("td");
      var sp=document.createElement("span");
      sp.className="rst"+(st==="청구함"?" s1":(st==="입금됨"?" s2":""));
      sp.textContent=st; tdS.appendChild(sp); tr.appendChild(tdS);

      cell(r.memo||"");

      var tdB=document.createElement("td");
      var ed=document.createElement("button"); ed.className="btn sm"; ed.textContent="수정";
      ed.onclick=function(){ royModal(r); };
      tdB.appendChild(ed); tr.appendChild(tdB);
      tbody.appendChild(tr);
    });

    var trT=document.createElement("tr"); trT.className="tot";
    var tdT=document.createElement("td"); tdT.colSpan=6; tdT.textContent="총합계"; trT.appendChild(tdT);
    var tdV=document.createElement("td"); tdV.className="num";
    tdV.textContent=won(rows.reduce(function(s,r){return s+royAmount(r)},0))+"원"; trT.appendChild(tdV);
    var tdE=document.createElement("td"); tdE.colSpan=3; trT.appendChild(tdE);
    tbody.appendChild(trT);

    tb.appendChild(tbody);
    box2.appendChild(tb);
    wrap.appendChild(box2);
  });
}

/* ---------- 엑셀 읽고 쓰기 ---------- */
/*  표 만드는 연장(SheetJS)은 누를 때 한 번만 받아 옵니다. */
var XLSJS=null;
function needXlsx(){
  if(XLSJS) return Promise.resolve(XLSJS);
  if(window.XLSX){ XLSJS=window.XLSX; return Promise.resolve(XLSJS); }
  return new Promise(function(res,rej){
    var sc=document.createElement("script");
    sc.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    sc.onload=function(){ XLSJS=window.XLSX; XLSJS? res(XLSJS) : rej(new Error("연장을 읽지 못했습니다")); };
    sc.onerror=function(){ rej(new Error("인터넷에서 연장을 받지 못했습니다")); };
    document.head.appendChild(sc);
  });
}

/* 머리글 줄을 찾아 칸 번호를 알아낸다. 띄어쓰기나 줄 위치가 달라도 견딥니다. */
var ROY_COLS=[
  ["no",    /^(no|번호|순번)\.?$/i],
  ["item",  /제품|품명|상품/],
  ["qty",   /제작수량|수량|생산/],
  ["ship",  /출하/],
  ["price", /판매가|소비자가|정가/],
  ["rate",  /로열티율|요율|율$/],
  ["amount",/합계|금액|정산/]
];
function readRoySheet(rows){
  var hdr=-1, map={};
  for(var i=0;i<Math.min(rows.length,25);i++){
    var row=rows[i]||[], hit={}, n=0;
    for(var c=0;c<row.length;c++){
      var t=String(row[c]==null?"":row[c]).trim();
      if(!t) continue;
      ROY_COLS.forEach(function(k){
        if(hit[k[0]]!=null) return;
        if(k[1].test(t)){ hit[k[0]]=c; n++; }
      });
    }
    if(hit.item!=null && n>=3){ hdr=i; map=hit; break; }
  }
  if(hdr<0) return null;

  var out=[];
  for(var r=hdr+1;r<rows.length;r++){
    var row=rows[r]||[];
    function g(k){ return map[k]==null? "" : row[map[k]]; }
    var nameCell=String(g("item")==null?"":g("item")).trim();
    if(!nameCell) continue;
    if(/^(총\s*합계|합계|총계|소계)/.test(nameCell)) continue;
    var qty=num(g("qty"));
    if(!qty && !num(g("ship")) && !num(g("price"))) continue;   /* 빈 줄·꼬리말 건너뛰기 */
    var rate=num(g("rate"));
    if(rate>0 && rate<=1) rate=rate*100;                        /* 0.05 로 적힌 값 */
    out.push({
      no:    String(g("no")==null?"":g("no")).trim() || String(out.length+1),
      item:  nameCell,
      qty:   qty? String(qty) : "",
      ship:  num(g("ship"))? String(num(g("ship"))) : "",
      price: num(g("price"))? String(num(g("price"))) : "",
      rate:  rate? String(Math.round(rate*1000)/1000) : ""
    });
  }
  return out;
}

/* 파일 이름에서 IP 이름과 달을 짐작한다 (원피스_로열티_7월_정산_리스트.xlsx) */
function guessFromName(fn){
  var base=String(fn||"").replace(/\.(xlsx|xlsm|xls|csv)$/i,"");
  var m=base.match(/(20\d{2})/), y=m? m[1] : String(new Date().getFullYear());
  var mm=base.match(/(\d{1,2})\s*월/);
  var period=mm? (y+"-"+("0"+mm[1]).slice(-2)) : "";
  var first=base.split(/[_\-\s]+/)[0]||"";
  var ipId="";
  data.ips.forEach(function(i){
    if(!ipId && i.name && (base.indexOf(i.name)>=0 || (first && i.name.indexOf(first)>=0))) ipId=i.id;
  });
  return {ipId:ipId, period:period, guessName:first};
}

document.getElementById("royUp").addEventListener("click", function(){
  var f=document.createElement("input");
  f.type="file"; f.accept=".xlsx,.xlsm,.xls,.csv"; f.style.display="none";
  document.body.appendChild(f);
  f.onchange=function(){
    var file=this.files[0]; document.body.removeChild(f);
    if(!file) return;
    toast("엑셀을 읽는 중…");
    needXlsx().then(function(X){
      var fr=new FileReader();
      fr.onload=function(){
        var wb, rowsAll=null, usedSheet="";
        try{ wb=X.read(new Uint8Array(fr.result),{type:"array"}); }
        catch(err){ toast("엑셀을 열지 못했습니다."); return; }
        for(var i=0;i<wb.SheetNames.length;i++){
          var rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]],{header:1,raw:true,defval:""});
          var got=readRoySheet(rows);
          if(got && got.length){ rowsAll=got; usedSheet=wb.SheetNames[i]; break; }
        }
        if(!rowsAll){ toast("제품명·제작수량·로열티율 칸을 찾지 못했습니다."); return; }
        royImportModal(rowsAll, file.name, usedSheet);
      };
      fr.readAsArrayBuffer(file);
    }).catch(function(err){ toast(err.message||"연장을 받지 못했습니다."); });
  };
  f.click();
});

             '<td class="num">'+(num(r.qty)?won(r.qty):"—")+'</td>'+
             '<td class="num">'+(num(r.ship)?won(r.ship)+"원":"—")+'</td>'+
             '<td class="num">'+(num(r.price)?won(r.price)+"원":"—")+'</td>'+
             '<td class="num">'+(num(r.rate)?r.rate+"%":"—")+'</td>'+
             '<td class="num">'+won(royAmount(r))+'원</td></tr>';
    }).join("")+
    '<tr class="tot"><td colspan="6">총합계</td><td class="num">'+won(sum)+'원</td></tr>'+
    '</tbody></table></div>';

  var html=
   '<p style="margin:0 0 14px;font-size:14px;font-weight:700">'+esc(fileName)+'</p>'+
   '<div class="row2">'+
     '<div class="f"><label for="uIp">어느 IP 건가요</label><select id="uIp">'+opts(ipOpts,g.ipId)+'</select></div>'+
     '<div class="f"><label for="uPeriod">정산 기간</label><input id="uPeriod" value="'+esc(g.period).replace(/"/g,"&quot;")+'" placeholder="예: 2026-07"></div>'+
   '</div>'+
   '<div class="f"><label for="uState">상태</label><select id="uState">'+opts(ROY_STATES,"청구 전")+'</select></div>'+
   '<div class="f"><label>읽어 온 내용 · '+rows.length+'줄'+(sheetName?' ('+esc(sheetName)+' 시트)':'')+'</label>'+prev+'</div>'+
   '<p class="ratehint">같은 IP·같은 기간에 이미 넣어 둔 줄이 있으면 제품명이 같은 것은 새 값으로 바꿉니다.</p>';

  modal("엑셀에서 정산 읽어 오기", esc(fileName), html, function(host){
    var ipId=val(host,"uIp"), period=val(host,"uPeriod"), state=val(host,"uState");
    if(!period){ toast("정산 기간을 넣어 주세요."); return false; }
    var now=new Date().toISOString(), added=0, updated=0;
    rows.forEach(function(r){
      var old=data.roy.filter(function(x){
        return x.ipId===ipId && (x.period||"")===period && (x.item||"")===r.item;
      })[0];
      var obj=old||{id:uid("roy")};
      obj.ipId=ipId; obj.period=period; obj.state=old? (old.state||state) : state;
      obj.no=r.no; obj.item=r.item; obj.qty=r.qty; obj.ship=r.ship; obj.price=r.price; obj.rate=r.rate;
      obj.updated=now;
      if(old) updated++; else { data.roy.push(obj); added++; }
    });
    save(); refreshFilters(); renderRoy();
    toast("새로 "+added+"줄, 고친 것 "+updated+"줄 넣었습니다.");
  }, {wide:true});
}

/* 늘 쓰시던 양식 그대로 내보내기 */
document.getElementById("royDown").addEventListener("click", function(){
  var fi=document.getElementById("fRoyIp").value;
  var fp=document.getElementById("fRoyPeriod").value;
  var rows=data.roy.filter(function(r){
    if(fi&&r.ipId!==fi) return false;
    if(fp&&(r.period||"")!==fp) return false;
    return true;
  });

  exportRoy(rows, fi? ipName(fi) : "전체", fp||"");
});

function exportRoy(rows, ipLabel, period){
  needXlsx().then(function(X){
    rows=rows.slice().sort(function(a,b){ return (num(a.no)||9999)-(num(b.no)||9999); });
    var aoa=[[],[],["[부서별] IP 로열티 정산 리스트"],
             ["No. ","제품명 ","제작수량 ","출하가 ","판매가 ","로열티율 ","합계 "]];
    rows.forEach(function(r,i){
      aoa.push([ num(r.no)||i+1, r.item||"", num(r.qty)||0,
                 num(r.ship)||0, num(r.price)||"", num(r.rate)/100, 0 ]);
    });
    aoa.push(["총합계 ","","","","","",0]);

    var ws=X.utils.aoa_to_sheet(aoa, {origin:"B1"});
    /* 합계 칸은 엑셀 식 그대로 넣어 둔다 — 파일에서 숫자를 고치면 다시 셉니다 */
    for(var i=0;i<rows.length;i++){
      var rn=5+i;                                    /* 표는 5번째 줄부터 */
      var useShip=num(rows[i].ship)>0;
      var cell={t:"n", v:royAmount(rows[i]), z:"#,##0",
                f: useShip ? ("D"+rn+"*E"+rn+"*G"+rn)
                           : ("ROUND(F"+rn+"/1.1,0)*G"+rn+"*D"+rn)};
      ws["H"+rn]=cell;
      ["D","E","F"].forEach(function(c){ if(ws[c+rn]) ws[c+rn].z="#,##0"; });
      if(ws["G"+rn]) ws["G"+rn].z="0.0%";
    }
    var last=5+rows.length;
    ws["H"+last]={t:"n", v:rows.reduce(function(s,r){return s+royAmount(r)},0),
                  z:"#,##0", f:"SUM(H5:H"+(last-1)+")"};
    ws["!merges"]=[{s:{r:2,c:1},e:{r:2,c:7}},{s:{r:last-1,c:1},e:{r:last-1,c:6}}];
    ws["!cols"]=[{wch:3},{wch:5},{wch:30},{wch:11},{wch:11},{wch:11},{wch:10},{wch:15}];

    var wb=X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, "Sheet1");
    var nm=[ipLabel||"IP","로열티",period||today(),"정산_리스트"].join("_")+".xlsx";
    X.writeFile(wb, nm);
    toast("내려받았습니다.");
  }).catch(function(err){ toast(err.message||"연장을 받지 못했습니다."); });
}

/* ---------- docs ---------- */
function renderDocs(){
  var wrap=document.getElementById("docWrap"); wrap.innerHTML="";
  var fi=document.getElementById("fDocIp").value, ft=document.getElementById("fDocType").value;
  var q=document.getElementById("fDocQ").value.trim().toLowerCase();
  var list=data.docs.filter(function(d){
    if(fi&&d.ipId!==fi) return false;
    if(ft&&d.type!==ft) return false;
    if(q&&(d.title||"").toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  if(!list.length){
    var e=document.createElement("div"); e.className="empty";
    e.textContent=data.docs.length? "조건에 맞는 자료가 없습니다." : "제안서, 시안, 회신 기록을 모아 두는 곳입니다.";
    wrap.appendChild(e); return;
  }
  list.forEach(function(d){
    var row=document.createElement("div"); row.className="doc";
    var left=document.createElement("div");
    var t=document.createElement("b"); t.textContent=d.title; left.appendChild(t);
    var m=document.createElement("div"); m.className="m";
    m.textContent=[ipName(d.ipId), d.type, d.date, d.fileName||(d.url?"링크":"")].filter(Boolean).join("  ·  ");
    left.appendChild(m);
    if(d.memo){ var mm=document.createElement("div"); mm.className="m"; mm.style.marginTop="4px"; mm.textContent=d.memo; left.appendChild(mm); }
    var side=document.createElement("div"); side.className="rowbtns";
    if(d.url){
      var a=document.createElement("a"); a.className="btn sm"; a.href=d.url; a.target="_blank"; a.rel="noopener"; a.textContent="열기";
      side.appendChild(a);
    }
    if(d.fileId){
      var dl=document.createElement("button"); dl.className="btn sm"; dl.textContent="내려받기";
      dl.addEventListener("click", function(){
        fileGet(d.fileId).then(function(u){
          if(!u){ toast("파일을 찾지 못했습니다."); return; }
          var a2=document.createElement("a"); a2.href=u; a2.download=d.fileName||"file"; a2.click();
        });
      });
      side.appendChild(dl);
    }
    var ed=document.createElement("button"); ed.className="btn sm"; ed.textContent="수정";
    ed.addEventListener("click", function(){ docModal(d); });
    var de=document.createElement("button"); de.className="btn sm warn"; de.textContent="삭제";
    de.addEventListener("click", function(){
      if(!confirm(d.title+"을(를) 지울까요?")) return;
      if(d.fileId) fileDel(d.fileId);
      data.docs=data.docs.filter(function(x){ return x.id!==d.id; });
      save(); renderDocs(); renderIps();
    });
    side.appendChild(ed); side.appendChild(de);
    row.appendChild(left); row.appendChild(side); wrap.appendChild(row);
  });
}
document.getElementById("addDoc").addEventListener("click", function(){ docModal(null); });
function docModal(d){
  var e=d||{}, pending=null, pendingName="";
  var ipOpts=[{v:"",t:"IP 없음"}].concat(data.ips.map(function(i){ return {v:i.id,t:i.name}; }));
  var html=
   '<div class="f"><label for="cTitle">제목</label><input id="cTitle" value="'+esc(e.title||"").replace(/"/g,"&quot;")+'" placeholder="예: 산리오 콜라보 1차 제안서"></div>'+
   '<div class="row2">'+
     '<div class="f"><label for="cIp">연결 IP</label><select id="cIp">'+opts(ipOpts,e.ipId||"")+'</select></div>'+
     '<div class="f"><label for="cType">종류</label><select id="cType">'+opts(DOC_TYPES,e.type||"제안서")+'</select></div>'+
   '</div>'+
   '<div class="f"><label for="cDate">날짜</label><input type="date" id="cDate" value="'+esc(e.date||today())+'"></div>'+
   '<div class="f"><label for="cUrl">링크 주소</label><input id="cUrl" value="'+esc(e.url||"").replace(/"/g,"&quot;")+'" placeholder="드라이브 링크를 붙여 넣으세요"></div>'+
   '<div class="f"><label>파일 첨부</label><button class="btn" id="cPick" style="width:100%">'+
     (e.fileName? "파일 바꾸기 · 지금 "+esc(e.fileName) : "파일 고르기")+'</button>'+
     '<div class="m" id="cFileMsg" style="color:var(--mid);font-size:12.5px;margin-top:6px"></div></div>'+
   '<div class="f"><label for="cMemo">메모</label><textarea id="cMemo">'+esc(e.memo||"")+'</textarea></div>';
  var host=modal(d?"자료 수정":"자료 추가","링크만 걸어도 되고, 파일을 함께 올려도 됩니다.",html,function(host){
    var title=val(host,"cTitle");
    if(!title){ toast("제목을 넣어 주세요."); return false; }
    var obj=d||{id:uid("dc")};
    obj.title=title; obj.ipId=val(host,"cIp"); obj.type=val(host,"cType");
    obj.date=val(host,"cDate"); obj.url=val(host,"cUrl"); obj.memo=val(host,"cMemo");
    var done=Promise.resolve();
    if(pending){
      var fid=uid("f");
      if(obj.fileId) fileDel(obj.fileId);
      done=filePut(fid,pending).then(function(){ obj.fileId=fid; obj.fileName=pendingName; });
    }
    done.then(function(){
      if(!d) data.docs.unshift(obj);
      save(); renderDocs(); renderIps();
    });
  });
  host.querySelector("#cPick").addEventListener("click", function(){
    var fp=document.getElementById("filePick"); fp.value="";
    fp.onchange=function(){
      var f=fp.files&&fp.files[0]; if(!f) return;
      if(f.size>4*1024*1024){ host.querySelector("#cFileMsg").textContent="4MB가 넘습니다. 드라이브에 올리고 링크로 걸어 주세요."; return; }
      var fr=new FileReader();
      fr.onload=function(){ pending=fr.result; pendingName=f.name;
        host.querySelector("#cFileMsg").textContent="고른 파일 · "+f.name; };
      fr.readAsDataURL(f);
    };
    fp.click();
  });
}

/* ---------- backup ---------- */
document.getElementById("expJson").addEventListener("click", function(){
  var out={ips:data.ips,md:data.md,roy:data.roy,docs:JSON.parse(JSON.stringify(data.docs))};
  var jobs=out.docs.map(function(d,i){
    if(!d.fileId) return Promise.resolve();
    return fileGet(d.fileId).then(function(u){ out.docs[i].fileData=u||null; });
  });
  Promise.all(jobs).then(function(){
    var blob=new Blob([JSON.stringify(out)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="ip_업무_"+today()+".json"; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  });
});
document.getElementById("impJson").addEventListener("click", function(){
  var jp=document.getElementById("jsonPick"); jp.value=""; jp.click();
});
document.getElementById("jsonPick").addEventListener("change", function(){
  var f=this.files&&this.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result);
      if(!confirm("지금 저장된 내용은 덮어써집니다. 불러올까요?")) return;
      data.ips=o.ips||[]; data.md=o.md||[]; data.roy=o.roy||[]; data.docs=o.docs||[];
      var jobs=data.docs.map(function(d){
        var fd=d.fileData; delete d.fileData;
        if(!fd) return Promise.resolve();
        var fid=uid("f");
        return filePut(fid,fd).then(function(){ d.fileId=fid; });
      });
      Promise.all(jobs).then(function(){ save(); redrawAll(); toast("불러왔습니다."); });
    }catch(e){ toast("파일 형식이 맞지 않습니다."); }
  };
  fr.readAsText(f);
});

/* boot */
function redrawAll(){ refreshFilters(); renderIps(); renderBoard(); renderRoy(); renderDocs(); }

/* 저장소에 올려 둔 백업 파일을 읽어 합친다 */
function loadShared(){
  /* 저장소 파일은 '판 번호'가 올라갔을 때만 한 번 덮어씁니다.
     그래야 내가 고친 내용(대표 이미지 등)이 다시 파일 내용으로 되돌아가지 않습니다. */
  var SEEDKEY="brkg_ip_seed";
  return fetch("/data/ip.json",{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      var ver=+(j.seed||0), had=0;
      try{ had=+(localStorage.getItem(SEEDKEY)||0); }catch(e){}
      var fresh=(ver>had), changed=false;
      ["ips","md","roy","docs"].forEach(function(k){
        var rows=(j&&j[k])||[]; if(!rows.length) return;
        var byId={}; (data[k]||[]).forEach(function(x){byId[x.id]=x});
        rows.forEach(function(x){
          if(!byId[x.id]){ byId[x.id]=x; changed=true; return; }   /* 없는 건 언제나 넣는다 */
          if(fresh){ byId[x.id]=x; changed=true; }                 /* 새 판일 때만 덮어쓴다 */
        });
        data[k]=Object.keys(byId).map(function(id){return byId[id]});
      });
      if(fresh){ try{ localStorage.setItem(SEEDKEY,String(ver)); }catch(e){} }
      if(changed) saveLocal();
      return changed;
    })
    .catch(function(){ return false; });
}

function boot(){
  var sb=document.getElementById("saveBtn");
  if(sb) sb.onclick=saveNow;
  markDirty();
  window.addEventListener("beforeunload",function(e){
    if(!dirty) return;
    e.preventDefault(); e.returnValue="";
  });
  load(); redrawAll();
  /* 시트를 먼저 읽고, 저장소 파일(data/ip.json)을 나중에 합친다.
     파일 쪽이 더 최근이면 파일 내용이 이기고, 그 결과를 시트에 다시 올린다. */
  pull().then(function(){
    redrawAll();
    return loadShared();
  }).then(function(changed){
    redrawAll();
    if(syncOn && (changed || remoteEmpty) && !dirty){
      pushAll(); toast("저장소 파일 내용으로 맞췄습니다");
    }
  });

  /* 다른 사람이 저장한 내용을 2분마다 받아 옵니다.
     내가 아직 저장을 안 눌렀으면 건드리지 않습니다. */
  setInterval(function(){
    if(!DATA_URL || dirty) return;
    pull().then(redrawAll);
  }, 120000);
}
if(opened()) openApp(); else document.getElementById("gateInput").focus();
})();
