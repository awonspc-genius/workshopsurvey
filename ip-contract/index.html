<style>
:root{--bg:#F4F5F9;--paper:#fff;--ink:#1B2240;--muted:#6E769B;--line:#E2E5EF;--accent:#2B4CC4;--danger:#B3372B}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;display:grid;place-items:center;padding:24px}
form{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:36px;width:100%;max-width:380px}
.logo{font-size:14px;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}h1{font-size:22px;margin:0 0 22px}
label{font-size:13px;color:var(--muted)}input{width:100%;font-size:18px;padding:14px;margin:6px 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
.msg{min-height:20px;margin-top:14px;font-size:14px;color:var(--danger)}

(function(){
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function b64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function aes(raw,use){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,[use]);}
