(function(){
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function b64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function aes(raw,use){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,[use]);}
function open(scope,kek){var w=G.wraps[scope];
  return aes(kek,'decrypt').then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(w.iv)},k,u8(w.ct));})
  .then(function(ck){return aes(ck,'decrypt');})
  .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(G.body.iv)},k,u8(G.body.ct));})
  .then(function(buf){try{sessionStorage.setItem('gk_'+scope,b64(kek));}catch(e){}
    var html=new TextDecoder().decode(buf);document.open();document.write(html);document.close();return true;});}
function tryAll(list,i){if(i>=list.length)return Promise.reject();return list[i]().catch(function(){return tryAll(list,i+1);});}
var scopes=Object.keys(G.wraps),saved=[];
scopes.forEach(function(s){var v=null;try{v=sessionStorage.getItem('gk_'+s);}catch(e){}if(v)saved.push(function(){return open(s,u8(v));});});
function showForm(){try{var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css';document.head.appendChild(l);}catch(e){}document.getElementById('f').hidden=false;document.getElementById('p').focus();}
function start(){if(!window.crypto||!crypto.subtle){showForm();return;}try{tryAll(saved,0).catch(showForm);}catch(e){showForm();}}
if(document.readyState==='complete')start();else addEventListener('load',start);
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
  var pw=document.getElementById('p').value.trim(),m=document.getElementById('m'),b=document.getElementById('b');
  function fail(msg){m.textContent=msg;b.disabled=false;b.textContent='들어가기';var p=document.getElementById('p');p.value='';p.focus();}
  if(!window.crypto||!crypto.subtle){  /* http 주소 등 암호 풀기 기능이 없는 경우 */
    if(location.protocol==='http:'){m.textContent='안전한 주소(https)로 옮기는 중…';location.replace('https://'+location.host+location.pathname+location.search);return;}
    fail('이 브라우저에서는 열 수 없어요. 크롬이나 사파리 최신 버전으로 열어 주세요.');return;}
  m.textContent='';b.disabled=true;b.textContent='확인하는 중…';
  var guard=setTimeout(function(){fail('확인이 늦어지고 있어요. 새로고침 후 다시 넣어 주세요.');},10000);
  try{
    var enc=new TextEncoder().encode(pw);
    crypto.subtle.importKey('raw',enc,'PBKDF2',false,['deriveBits']).then(function(base){
      return tryAll(scopes.map(function(s){return function(){
        return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u8(G.salts[s]),iterations:G.iter},base,256).then(function(kek){return open(s,new Uint8Array(kek));});};}),0);
    }).then(function(){clearTimeout(guard);},function(){clearTimeout(guard);fail('비밀번호가 맞지 않아요.');});
  }catch(err){clearTimeout(guard);fail('비밀번호가 맞지 않아요.');}
});
})();
